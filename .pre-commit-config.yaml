repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        args:
          [
            "--config=pyproject.toml",
          ]
        files: \.py$
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        files: \.py$
  - repo: local
    hooks:
      - id: pylint
        name: PyLint
        entry: pylint
        args:
          [
            "--rcfile=.pylintrc",
          ]
        language: system
        files: \.py$
        require_serial: true
      - id: mypy
        name: MyPy
        entry: mypy
        args:
          [
            "--config-file=mypy.ini",
          ]
        language: system
        files: \.py$
        require_serial: true
